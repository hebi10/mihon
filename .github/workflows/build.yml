name: Local Reader CI

on:
  push:
    branches:
      - main
      - feature/offline-local-comic-reader
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reject network and advertising code in the shipped module
        shell: bash
        run: |
          set -euo pipefail
          if grep -RiE 'okhttp|retrofit|firebase|crashlytics|telemetry|coil-network|play-services-ads' reader/build.gradle.kts; then
            echo "Network/ads dependency detected"
            exit 1
          fi
          if grep -RiE 'https?://|OkHttpClient|HttpURLConnection|Retrofit|Firebase|AdView|AdvertisingIdClient' reader/src/main/java; then
            echo "Network/ads call detected"
            exit 1
          fi
      - name: Build and run unit tests
        run: ./gradlew :reader:assembleDebug :reader:testDebugUnitTest --stacktrace
      - name: Check the merged Android manifest has no network or advertising permissions
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find reader/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -n 1)"
          test -n "$manifest"
          if grep -E 'android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE|android.permission.ACCESS_WIFI_STATE|com.google.android.gms.permission.AD_ID' "$manifest"; then
            echo "Forbidden permission found in merged manifest"
            exit 1
          fi
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: hebi-comic-reader-debug
          path: reader/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish preview APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=reader/build/outputs/apk/debug/reader-debug.apk
          test -s "$apk"
          cp "$apk" hebi-comic-reader-v0.2.0-preview.apk
          if gh release view v0.2.0-preview >/dev/null 2>&1; then
            gh release upload v0.2.0-preview hebi-comic-reader-v0.2.0-preview.apk --clobber
          else
            gh release create v0.2.0-preview hebi-comic-reader-v0.2.0-preview.apk \
              --target "$GITHUB_SHA" \
              --title "해비 만화 뷰어 v0.2.0-preview" \
              --prerelease \
              --notes "로컬 폴더, 웹툰/가로/두 페이지 보기, ZIP/CBZ, 회차 이미지 합치기, 오프라인 전용. 테스트용 debug 서명 APK이므로 정식 배포 전 별도 서명 구성이 필요합니다."
          fi
